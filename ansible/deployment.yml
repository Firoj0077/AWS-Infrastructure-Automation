
---
- name: Deploy static website on AWS EC2
  hosts: aws_ec2
  become: yes
  remote_user: ec2-user
  connection: ssh

  vars:
    ansible_ssh_private_key_file: "/etc/ansible/imp.pem"

  tasks:

    - name: Install Apache web server
      yum:
        name: httpd
        state: present

    - name: Start and enable Apache
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Install Git
      yum:
        name: git
        state: present

    - name: Remove existing website directory
      file:
        path: /var/www/html
        state: absent

    - name: Clone website source code from GitHub
      git:
        repo: "https://github.com/devops0014/staticsite-docker.git"
        dest: /var/www/html
        update: yes
        version: master

    - name: Set website directory permissions
      file:
        path: /var/www/html
        owner: apache
        group: apache
        recurse: yes
        state: directory

    - name: Restart Apache
      service:
        name: httpd
        state: restarted
